<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Sabab Mojumder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Ambient Background Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-teal-300/30 dark:bg-teal-900/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-indigo-300/30 dark:bg-indigo-900/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-emerald-300/30 dark:bg-emerald-900/20 rounded-full blur-3xl"></div>
    </div>

    <!-- LOCK SCREEN OVERLAY -->
    <div id="lockScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md">
        <div class="glass p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl border border-white/10">
            <div class="w-16 h-16 bg-teal-500/10 text-teal-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-1">Sabab's Vault</h2>
            <p class="text-xs text-slate-400 mb-6">Enter PIN to sync & unlock</p>
            
            <form onsubmit="verifyPin(event)" class="space-y-4">
                <input type="password" id="pinInput" placeholder="••••" maxlength="8" autofocus required
                    class="w-full text-center text-2xl tracking-widest py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                <p id="pinError" class="text-xs text-rose-400 hidden">Incorrect PIN. Try again.</p>
                <button type="submit" class="w-full py-3 bg-teal-600 hover:bg-teal-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-teal-500/20 transition-all">
                    Unlock Application
                </button>
            </form>
            <p class="text-[10px] text-slate-500 mt-4">Default PIN: 1234 (Changeable inside settings)</p>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="appContent" class="max-w-6xl mx-auto px-4 py-6 md:py-10 hidden">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
                    Welcome back, <span class="text-teal-600 dark:text-teal-400">Sabab Mojumder</span>
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Real-time Cloud Sync Enabled ☁️</p>
            </div>
            <div class="flex items-center gap-3 self-end sm:self-auto">
                <button onclick="lockApp()" title="Lock App" class="p-2.5 rounded-xl glass text-slate-600 dark:text-slate-300 hover:bg-white/80 dark:hover:bg-slate-800/80 transition-all shadow-sm">
                    <i class="fa-solid fa-lock text-amber-500"></i>
                </button>
                <button onclick="changePinPrompt()" title="Change PIN" class="p-2.5 rounded-xl glass text-slate-600 dark:text-slate-300 hover:bg-white/80 dark:hover:bg-slate-800/80 transition-all shadow-sm">
                    <i class="fa-solid fa-key text-teal-500"></i>
                </button>
                <button id="themeToggle" class="p-2.5 rounded-xl glass text-slate-600 dark:text-slate-300 hover:bg-white/80 dark:hover:bg-slate-800/80 transition-all shadow-sm">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline"></i>
                </button>
                <button onclick="exportCSV()" class="px-3.5 py-2 rounded-xl glass text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-white/80 dark:hover:bg-slate-800/80 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-download text-teal-500"></i> Export CSV
                </button>
            </div>
        </header>

        <!-- Stats Overview Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="glass p-5 rounded-2xl shadow-sm border border-white/40 dark:border-slate-800/60">
                <div class="flex justify-between items-center text-slate-500 dark:text-slate-400 text-xs font-medium mb-2">
                    <span>THIS MONTH'S TOTAL</span>
                    <i class="fa-solid fa-calendar-days text-teal-500"></i>
                </div>
                <div class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white" id="monthTotal">৳0</div>
                <div class="text-xs text-slate-400 mt-2" id="monthLabel">October 2026</div>
            </div>

            <div class="glass p-5 rounded-2xl shadow-sm border border-white/40 dark:border-slate-800/60">
                <div class="flex justify-between items-center text-slate-500 dark:text-slate-400 text-xs font-medium mb-2">
                    <span>DAILY AVERAGE</span>
                    <i class="fa-solid fa-chart-line text-indigo-500"></i>
                </div>
                <div class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white" id="dailyAvg">৳0</div>
                <div class="
